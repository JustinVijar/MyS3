[package]
name = "rust-s3-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
axum-server = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
hyper = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = "0.3"
mime_guess = "2"

# Database & Serialization
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# Cryptography, Hashing, & SigV4
ring = "0.17"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
blake3 = "1.5"
digest = "0.10"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }

# Terminal UI & Embedded Web
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
rust-embed = "8.5"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

# WireGuard (optional userspace)
boringtun = { version = "0.6", features = ["device"] }

# gRPC & Protobuf (Internal Cluster Replication over WireGuard)
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

# Utility & Error Handling
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
